# nginx que serve o bundle do Vite (SPA). TLS e roteamento ficam no Traefik da
# VPS: `crm.programeai.com.br/` chega aqui e `crm.programeai.com.br/api/*` vai
# direto para o container da API — este servidor nunca faz proxy para a API.
#
# ATENÇÃO ao editar: um `add_header` dentro de um `location` DESCARTA todos os
# `add_header` herdados do `server` (o nginx substitui, não soma). Por isso os
# cabeçalhos de segurança ficam só aqui no nível do server e os blocos abaixo
# usam `expires`/`default_type`, que não interferem nessa herança.
server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css application/javascript application/json
             image/svg+xml application/manifest+json;

  # Cabeçalhos de segurança (valem para todas as respostas deste server).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # O Traefik termina o TLS e o único entrypoint publicado é o websecure.
  add_header Strict-Transport-Security "max-age=31536000" always;
  # challenges.cloudflare.com: script + iframe do captcha Turnstile na tela de
  # registro. 'unsafe-inline' em style-src cobre os estilos inline que o React e
  # os primitivos @base-ui aplicam via atributo `style`.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  # Healthcheck do container (não passa pelo Traefik).
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Assets com hash no nome (dist/assets/*) — imutáveis, cache longo.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # index.html nunca é cacheado: é ele que aponta para o bundle novo a cada
  # deploy. `expires -1` emite Cache-Control: no-cache.
  location = /index.html {
    expires -1;
  }

  # SPA: qualquer rota do react-router cai no index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
