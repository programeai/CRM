# nginx que serve o bundle do Vite (SPA). TLS e roteamento ficam no Traefik da
# VPS: `crm.programeai.com.br/` chega aqui e `crm.programeai.com.br/api/*` vai
# direto para o container da API — este servidor nunca faz proxy para a API.
#
# Este arquivo é incluído dentro do bloco `http` do nginx (vai para
# conf.d/default.conf), por isso `log_format` e `map` podem viver aqui.
#

# `level` do log: o mesmo vocabulário da API, para o Grafana colorir e agrupar
# os dois containers do CRM do mesmo jeito.
map $status $nivel_log {
  ~^5   error;
  ~^4   warn;
  default info;
}

# Servidor de arquivos estáticos gera muita linha de sucesso e nenhuma
# informação: o que interessa aqui é 404 de asset (deploy com bundle antigo em
# cache) e 5xx. Para registrar todo acesso, remova o `if=$acesso_logavel` abaixo.
map $status $acesso_logavel {
  ~^[23] 0;
  default 1;
}

# Uma linha JSON por acesso, no formato que o Alloy/Loki da VPS sabe abrir
# (ver docs/observabilidade.md). `escape=json` é o que impede que um
# user-agent com aspas quebre a linha.
log_format observabilidade escape=json
  '{"level":"$nivel_log",'
  '"time":"$time_iso8601",'
  '"evento":"http.acesso",'
  '"requestId":"$http_x_request_id",'
  '"metodo":"$request_method",'
  '"rota":"$uri",'
  '"status":$status,'
  '"segundos":$request_time,'
  '"bytes":$body_bytes_sent,'
  '"ip":"$http_x_forwarded_for",'
  '"referer":"$http_referer",'
  '"ua":"$http_user_agent"}';

# ATENÇÃO ao editar: um `add_header` dentro de um `location` DESCARTA todos os
# `add_header` herdados do `server` (o nginx substitui, não soma). Por isso os
# cabeçalhos de segurança ficam só aqui no nível do server e os blocos abaixo
# usam `expires`/`default_type`, que não interferem nessa herança.
server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  # stdout: é de lá que o coletor da VPS lê (o access.log da imagem oficial já é
  # um symlink para /dev/stdout, mas ser explícito evita depender disso).
  access_log /dev/stdout observabilidade if=$acesso_logavel;
  error_log stderr warn;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css application/javascript application/json
             image/svg+xml application/manifest+json;

  # Cabeçalhos de segurança (valem para todas as respostas deste server).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # O Traefik termina o TLS e o único entrypoint publicado é o websecure.
  add_header Strict-Transport-Security "max-age=31536000" always;
  # challenges.cloudflare.com: script + iframe do captcha Turnstile na tela de
  # registro. 'unsafe-inline' em style-src cobre os estilos inline que o React e
  # os primitivos @base-ui aplicam via atributo `style`.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  # Healthcheck do container (não passa pelo Traefik).
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Assets com hash no nome (dist/assets/*) — imutáveis, cache longo.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # index.html nunca é cacheado: é ele que aponta para o bundle novo a cada
  # deploy. `expires -1` emite Cache-Control: no-cache.
  location = /index.html {
    expires -1;
  }

  # SPA: qualquer rota do react-router cai no index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
