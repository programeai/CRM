name: Build - Imagens de produção

# Publica as imagens no Docker Hub a cada push na main. NÃO faz deploy:
# a publicação na VPS é manual, pelo workflow "Deploy na VPS".
#
# As imagens são PÚBLICAS e o namespace é constante (env DOCKERHUB_NAMESPACE
# abaixo), não secret: quem autohospeda precisa conseguir ler o nome da imagem no
# repositório e usá-lo sem adivinhar. Os secrets DOCKERHUB_USERNAME/TOKEN servem
# só para autenticar o push (a conta que publica pode não ter o nome do
# namespace). Num fork, troque o valor de DOCKERHUB_NAMESPACE.
#
# Três tags por build, cada uma com um papel:
#  - `AAAA.MM.DD[.N]` (CalVer, fuso de São Paulo) — versão legível e imutável;
#    o `.N` distingue o 2º build do mesmo dia em diante.
#  - `<sha completo>` — endereço exato do commit, usado pelo rollback.
#  - `latest` — sempre o HEAD da main.
#
# Eficiência (minutos de Actions são cobrados por job, arredondados para cima):
#  1. `paths-ignore` barra o push antes de alocar runner — commit só de docs,
#     spec ou compose não gasta 1 minuto sequer.
#  2. Job único: um checkout, um login, um buildx. Dois jobs custariam o dobro
#     de setup, mesmo rodando em paralelo.
#  3. Detecção de mudança por app: commit que só toca o front não reconstrói a
#     imagem da API (e vice-versa).
#  4. O portão de qualidade é só `jest`. Compilar API e front aqui era trabalho
#     duplicado — os Dockerfiles já rodam `nest build` e `tsc -b && vite build`,
#     e build que falha não publica imagem nenhuma.
on:
  push:
    branches: [main]
    # Nada aqui entra nas imagens: o .dockerignore já exclui docs/, specs/,
    # .claude/ e todo *.md do contexto de build, e os composes são consumidos
    # pelo workflow de deploy (que faz checkout do repo por conta própria).
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "specs/**"
      - ".claude/**"
      - ".agents/**"
      - ".github/**"
      - ".gitignore"
      - ".env.example"
      - ".env.selfhost.example"
      - "docker-compose.yml"
      - "docker-compose.prod.yml"
      - "docker-compose.selfhost.yml"
      # Config do Caddy da autohospedagem: montada como volume, nunca entra em
      # imagem (o .dockerignore a exclui do contexto).
      - "docker/caddy/**"
      - LICENSE
      - NOTICE
  workflow_dispatch:
    inputs:
      reconstruir:
        description: "Quais imagens reconstruir (dispatch manual não tem diff para detectar)"
        type: choice
        default: ambas
        options: [ambas, api, web]

# Um build por ref; se vier push novo no meio, o anterior é descartado.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# `contents: write` só para empurrar a tag git da versão (passo final).
permissions:
  contents: write

# Namespace público das imagens. Constante de propósito — ver o cabeçalho.
env:
  DOCKERHUB_NAMESPACE: programeai

jobs:
  construir:
    runs-on: ubuntu-latest

    # Postgres para o e2e. Sobe junto com o job — não custa minuto extra de
    # runner, só os ~20s de healthcheck na primeira vez.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crm_user
          POSTGRES_PASSWORD: crm_password
          POSTGRES_DB: crm_db
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U crm_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      # fetch-depth: 0 para o diff funcionar em push com vários commits. O repo
      # tem ~1,4 MB, então o histórico completo é irrelevante no tempo.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------------------------------------------------
      # Decide o que reconstruir. Classifica cada arquivo do push; o que não
      # cai em nenhuma regra conhecida (lockfile, package.json da raiz,
      # .dockerignore, arquivo novo na raiz) reconstrói as duas imagens — errar
      # para o lado de reconstruir é mais barato que publicar imagem defasada.
      # -----------------------------------------------------------------------
      - name: Detectar apps afetados
        id: detectar
        env:
          BASE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          RECONSTRUIR: ${{ inputs.reconstruir }}
        run: |
          api=false
          web=false
          motivo=""

          decidido=false
          if [ "${{ github.event_name }}" != "push" ]; then
            # Dispatch manual não tem commit base para comparar: quem roda escolhe.
            # Útil para rebuildar só o front quando uma VITE_* muda (elas são
            # embutidas no bundle em build-time) sem pagar o build da API.
            decidido=true
            case "$RECONSTRUIR" in
              api) api=true;             motivo="disparo manual (só a API)" ;;
              web) web=true;             motivo="disparo manual (só o front)" ;;
              *)   api=true; web=true;   motivo="disparo manual (ambas)" ;;
            esac
          elif [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            # Branch nova ou force-push: o commit base não existe mais no grafo.
            decidido=true
            api=true
            web=true
            motivo="commit base indisponível (force-push?)"
          fi

          if [ "$decidido" = false ]; then
            arquivos="$(git diff --name-only "$BASE" "$SHA")"
            echo "Arquivos no push:"
            echo "$arquivos" | sed 's/^/  /'

            while IFS= read -r arquivo; do
              [ -n "$arquivo" ] || continue
              case "$arquivo" in
                # Inertes: não entram em imagem nenhuma. Mantido em uma linha —
                # continuação com `\` faria a indentação virar parte do padrão.
                *.md|docs/*|specs/*|.claude/*|.agents/*|.github/*|.gitignore|.env.example|docker-compose.yml|docker-compose.prod.yml|LICENSE|NOTICE)
                  ;;
                apps/api/*) api=true ;;
                apps/web/*) web=true ;;
                # Raiz compartilhada (pnpm-lock.yaml, package.json,
                # pnpm-workspace.yaml, .dockerignore) ou caminho desconhecido.
                *)
                  api=true
                  web=true
                  motivo="arquivo compartilhado alterado: $arquivo"
                  ;;
              esac
            done <<< "$arquivos"
          fi

          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "motivo=$motivo" >> "$GITHUB_OUTPUT"
          echo "Reconstruir → api=$api web=$web ${motivo:+($motivo)}"

      # -----------------------------------------------------------------------
      # Portão de qualidade da API. Só instala o workspace `api` — as deps do
      # front (react, vite, radix) não são necessárias para rodar o jest.
      # O front não tem suíte de teste; seu portão é o `tsc -b` do Dockerfile.
      # -----------------------------------------------------------------------
      - name: Instalar pnpm
        if: steps.detectar.outputs.api == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Instalar Node
        if: steps.detectar.outputs.api == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências da API
        if: steps.detectar.outputs.api == 'true'
        run: pnpm install --filter api --frozen-lockfile

      # O ts-jest checa tipos, então os tipos do Prisma Client precisam existir.
      - name: Gerar Prisma Client
        if: steps.detectar.outputs.api == 'true'
        run: pnpm --filter api exec prisma generate

      - name: Testes da API
        if: steps.detectar.outputs.api == 'true'
        run: pnpm --filter api test

      # O e2e sobe o AppModule real contra o Postgres do `services` acima. O
      # global-setup cria o banco crm_test e aplica as migrations sozinho.
      - name: Testes e2e da API
        if: steps.detectar.outputs.api == 'true'
        run: pnpm --filter api test:e2e

      # O e2e acima aplica as migrations num banco RECÉM-CRIADO, e é por isso que
      # ele não substitui este passo: migration de backfill se comporta diferente
      # com dado, e banco vazio faz o caminho perigoso não ser percorrido. Foi
      # essa lacuna que deixou 20260726120000_pipeline_stages_per_owner sair verde
      # daqui e derrubar a API em produção por 11 horas em 27/07/2026.
      #
      # O script aplica o init, insere uma fixture com dois owners e deals, e só
      # então roda o resto das migrations — depois confere invariantes de dado
      # (nenhum deal apontando para estágio de outro owner, RLS ainda de pé).
      # Roda sempre que a API é afetada, não só quando há migration nova: o que
      # quebra também pode ser um schema.prisma que saiu de sincronia.
      - name: Migrations contra banco com dados
        if: steps.detectar.outputs.api == 'true'
        env:
          DATABASE_URL: postgresql://crm_user:crm_password@localhost:5435/crm_db?schema=public
        run: apps/api/scripts/validar-migrations-com-dados.sh

      # -----------------------------------------------------------------------
      # Versão CalVer: AAAA.MM.DD para o primeiro build do dia, AAAA.MM.DD.N do
      # segundo em diante. O N vem do próprio registry (API pública do Docker
      # Hub, sem autenticação): contar as tags do dia é o que garante que uma
      # versão já publicada nunca seja sobrescrita — e sobrescrever versão é o
      # que faria "2026.07.30" deixar de significar algo.
      #
      # Fuso de São Paulo, não UTC: a data da tag tem que ser a mesma que o
      # mantenedor vê no calendário. Em UTC, um push às 22h viraria o dia
      # seguinte.
      #
      # Registry vazio, repositório ainda privado ou Hub fora do ar caem todos no
      # mesmo lugar: nenhuma tag encontrada → primeira versão do dia. Só custa uma
      # colisão de nome no pior caso, e o `latest`/sha do build seguem corretos.
      # -----------------------------------------------------------------------
      - name: Calcular versão CalVer
        id: versao
        run: |
          set -uo pipefail
          data="$(TZ=America/Sao_Paulo date +%Y.%m.%d)"

          # Maior sufixo já publicado hoje, entre as duas imagens (elas andam em
          # lockstep: todo build publica a mesma versão nas duas).
          maior=0
          for imagem in crm-api crm-web; do
            url="https://hub.docker.com/v2/repositories/${DOCKERHUB_NAMESPACE}/${imagem}/tags?page_size=100&name=${data}"
            resposta="$(curl -fsS --max-time 20 "$url" 2>/dev/null || true)"
            [ -n "$resposta" ] || continue

            n="$(printf '%s' "$resposta" | jq -r --arg data "$data" '
              [ .results[]?.name
                | select(. == $data or startswith($data + "."))
                | if . == $data then 1 else ((ltrimstr($data + ".") | tonumber?) // 0) end
              ] | max // 0' 2>/dev/null || echo 0)"
            case "$n" in ''|*[!0-9]*) n=0 ;; esac
            if [ "$n" -gt "$maior" ]; then maior="$n"; fi
          done

          if [ "$maior" -eq 0 ]; then versao="$data"; else versao="${data}.$((maior + 1))"; fi

          echo "versao=$versao" >> "$GITHUB_OUTPUT"
          echo "criado_em=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "Versão desta publicação: $versao"

      # -----------------------------------------------------------------------
      # Build e push das imagens que mudaram (tags `<calver>`, `<sha>`, `latest`).
      # -----------------------------------------------------------------------
      - name: Login no Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Buildx
        if: steps.detectar.outputs.api == 'true' || steps.detectar.outputs.web == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build e push da imagem da API
        if: steps.detectar.outputs.api == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/crm-api:${{ steps.versao.outputs.versao }}
            ${{ env.DOCKERHUB_NAMESPACE }}/crm-api:${{ github.sha }}
            ${{ env.DOCKERHUB_NAMESPACE }}/crm-api:latest
          # Procedência na própria imagem: `docker inspect` responde de qual
          # commit e de qual versão ela saiu, sem depender do Docker Hub.
          labels: |
            org.opencontainers.image.title=ProgrameAi CRM — API
            org.opencontainers.image.description=API do ProgrameAi CRM (NestJS + Prisma)
            org.opencontainers.image.source=https://github.com/programeai/CRM
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.version=${{ steps.versao.outputs.versao }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.versao.outputs.criado_em }}
          cache-from: type=gha,scope=crm-api
          cache-to: type=gha,mode=max,scope=crm-api

      # As VITE_* são embutidas no bundle em build-time: entram como build-args.
      - name: Build e push da imagem do front
        if: steps.detectar.outputs.web == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/crm-web:${{ steps.versao.outputs.versao }}
            ${{ env.DOCKERHUB_NAMESPACE }}/crm-web:${{ github.sha }}
            ${{ env.DOCKERHUB_NAMESPACE }}/crm-web:latest
          labels: |
            org.opencontainers.image.title=ProgrameAi CRM — Front
            org.opencontainers.image.description=Interface do ProgrameAi CRM (React + Vite, servida por nginx)
            org.opencontainers.image.source=https://github.com/programeai/CRM
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.version=${{ steps.versao.outputs.versao }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.versao.outputs.criado_em }}
          cache-from: type=gha,scope=crm-web
          cache-to: type=gha,mode=max,scope=crm-web
          build-args: |
            VITE_API_URL=/api/v1
            VITE_TURNSTILE_SITE_KEY=${{ secrets.VITE_TURNSTILE_SITE_KEY }}

      # -----------------------------------------------------------------------
      # Mantém a garantia que o workflow de deploy assume: TODO sha que passou
      # por aqui tem as duas imagens — e agora também a versão CalVer, para que
      # `2026.07.30` signifique o estado completo do CRM naquele build, não só a
      # metade que mudou. A imagem não reconstruída recebe as duas tags novas
      # apontando para o mesmo manifest do `latest` — é uma cópia de ponteiro no
      # registry (segundos), não um rebuild.
      # -----------------------------------------------------------------------
      - name: Alinhar tags nas imagens não reconstruídas
        if: steps.detectar.outputs.api == 'false' || steps.detectar.outputs.web == 'false'
        env:
          SHA: ${{ github.sha }}
          VERSAO: ${{ steps.versao.outputs.versao }}
          API_RECONSTRUIDA: ${{ steps.detectar.outputs.api }}
          WEB_RECONSTRUIDA: ${{ steps.detectar.outputs.web }}
        run: |
          set -e
          for par in "crm-api:$API_RECONSTRUIDA" "crm-web:$WEB_RECONSTRUIDA"; do
            imagem="${par%%:*}"
            reconstruida="${par##*:}"
            [ "$reconstruida" = "false" ] || continue

            origem="${DOCKERHUB_NAMESPACE}/${imagem}:latest"
            if ! docker manifest inspect "$origem" > /dev/null 2>&1; then
              echo "::warning::${imagem}:latest não existe no registry; ${VERSAO} e o sha ${SHA} ficarão sem essa imagem."
              continue
            fi
            echo "Tagueando ${imagem}:${VERSAO} e ${imagem}:${SHA} a partir de latest (sem rebuild)."
            docker buildx imagetools create \
              -t "${DOCKERHUB_NAMESPACE}/${imagem}:${VERSAO}" \
              -t "${DOCKERHUB_NAMESPACE}/${imagem}:${SHA}" \
              "$origem"
          done

      # -----------------------------------------------------------------------
      # As imagens de um projeto open source têm que ser puxáveis por qualquer
      # pessoa, sem login. Repositório novo no Docker Hub pode nascer privado
      # (depende da conta/plano), então em vez de confiar no default: confere
      # anonimamente e, se estiver privado, publica.
      #
      # Falha de API aqui é `::warning::`, nunca erro: as imagens já foram
      # publicadas e derrubar o build não as tornaria públicas — o que resolve é
      # o alerta com o link do botão.
      # -----------------------------------------------------------------------
      - name: Garantir que as imagens são públicas
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -uo pipefail

          jwt=""
          for imagem in crm-api crm-web; do
            url="https://hub.docker.com/v2/repositories/${DOCKERHUB_NAMESPACE}/${imagem}/"

            # Sem Authorization: só responde 200 se o repositório for público.
            if curl -fsS --max-time 20 "$url" > /dev/null 2>&1; then
              echo "${imagem}: público."
              continue
            fi

            # O token do push serve como senha na API do Hub (precisa de escopo de
            # escrita e de admin no repositório para alterar a visibilidade).
            if [ -z "$jwt" ]; then
              # Credenciais vêm de env (jq -n lê de `env`), nunca de argv: linha
              # de comando é legível por qualquer processo do runner.
              jwt="$(curl -fsS --max-time 20 -X POST https://hub.docker.com/v2/users/login \
                -H 'Content-Type: application/json' \
                -d "$(jq -nc '{username: env.DOCKERHUB_USERNAME, password: env.DOCKERHUB_TOKEN}')" 2>/dev/null \
                | jq -r '.token // empty' 2>/dev/null)"
            fi

            if [ -n "$jwt" ] && curl -fsS --max-time 20 -X PATCH "$url" \
                 -H "Authorization: JWT ${jwt}" \
                 -H 'Content-Type: application/json' \
                 -d '{"is_private": false}' > /dev/null 2>&1; then
              echo "${imagem}: estava privado, tornado público."
              continue
            fi

            echo "::warning::Não foi possível confirmar que ${DOCKERHUB_NAMESPACE}/${imagem} \
            é público. Torne-o público na mão em \
            https://hub.docker.com/repository/docker/${DOCKERHUB_NAMESPACE}/${imagem}/settings \
            — enquanto estiver privado, quem autohospeda não consegue puxar a imagem."
          done

      # -----------------------------------------------------------------------
      # Tag git da versão. Faz o CalVer existir também no repositório, o que dá
      # duas coisas: a pergunta "qual commit é a 2026.07.30?" passa a ter resposta
      # em https://github.com/programeai/CRM/tags, e o workflow de deploy
      # consegue fazer checkout do compose DAQUELE commit quando alguém faz
      # rollback informando a versão.
      #
      # Depois do push das imagens, de propósito: tag git sem imagem publicada
      # seria uma versão que não existe. Falha aqui não invalida o build.
      # -----------------------------------------------------------------------
      - name: Tag git da versão
        env:
          VERSAO: ${{ steps.versao.outputs.versao }}
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git tag -a "v${VERSAO}" -m "Imagens ${DOCKERHUB_NAMESPACE}/crm-{api,web}:${VERSAO}" 2>/dev/null \
             && git push origin "v${VERSAO}" 2>/dev/null; then
            echo "Tag v${VERSAO} criada."
          else
            echo "::warning::Não foi possível criar a tag git v${VERSAO} (já existe?). As imagens foram publicadas normalmente."
          fi

      # Deixa a versão e o SHA à mão: são os valores a colar no input do deploy.
      - name: Resumo
        env:
          API: ${{ steps.detectar.outputs.api }}
          WEB: ${{ steps.detectar.outputs.web }}
          MOTIVO: ${{ steps.detectar.outputs.motivo }}
          VERSAO: ${{ steps.versao.outputs.versao }}
        run: |
          rotulo() { [ "$1" = "true" ] && echo "reconstruída" || echo "reaproveitada de \`latest\` (sem rebuild)"; }
          {
            echo "### Versão publicada: \`${VERSAO}\`"
            echo ""
            echo "- \`${DOCKERHUB_NAMESPACE}/crm-api:${VERSAO}\` — $(rotulo "$API")"
            echo "- \`${DOCKERHUB_NAMESPACE}/crm-web:${VERSAO}\` — $(rotulo "$WEB")"
            echo ""
            # `[ ... ] && echo` sozinho abortaria o step: o shell dos steps roda
            # com `-e` e o status do teste falso é o status do comando completo.
            if [ -n "$MOTIVO" ]; then
              echo "Build completo: ${MOTIVO}."
              echo ""
            fi
            echo "Cada imagem recebeu três tags: \`${VERSAO}\` (versão imutável),"
            echo '`${{ github.sha }}` (commit) e `latest` (HEAD da main).'
            echo ""
            echo 'Para publicar na VPS: workflow **Deploy na VPS** → Run workflow →'
            echo "tag \`${VERSAO}\` (recomendado — fixa esta versão) ou \`latest\`."
          } >> "$GITHUB_STEP_SUMMARY"
