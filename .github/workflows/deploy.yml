name: Deploy na VPS

# Disparo manual (Actions → Deploy na VPS → Run workflow). As imagens já foram
# publicadas pelo workflow "Build - Imagens de produção"; aqui só escolhemos qual
# tag sobe. Deploy nunca acontece sozinho em push.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag das imagens: a versão CalVer (ex. `2026.07.30`), `latest` ou o SHA completo do commit"
        required: true
        default: latest
        type: string

# Evita dois deploys simultâneos sobrescrevendo o mesmo diretório na VPS.
# Sem cancel-in-progress: um deploy em andamento não é interrompido no meio.
concurrency:
  group: deploy-producao
  cancel-in-progress: false

# Mesmo namespace público do workflow de build.
env:
  DOCKERHUB_NAMESPACE: programeai

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # O compose tem que vir do MESMO commit da imagem, senão um rollback
      # subiria imagem antiga com compose novo. Três casos:
      #   - `latest`     → a ref de onde o workflow foi disparado;
      #   - CalVer       → a tag git `v<versão>` que o build criou (o `.` no meio
      #                    é o que distingue: SHA nunca tem ponto);
      #   - SHA completo → o próprio commit.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag == 'latest' && github.ref || (contains(inputs.tag, '.') && format('v{0}', inputs.tag) || inputs.tag) }}

      # Estes dois não têm default em lugar nenhum: ACME_RESOLVER errado quebraria
      # o TLS e DEPLOY_DIR vazio faria o compose rodar no home do usuário. Falhar
      # aqui é gratuito — um dispatch que para no runner não altera a produção.
      - name: Conferir configuração da VPS
        env:
          ACME_RESOLVER: ${{ secrets.ACME_RESOLVER }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          set -e
          faltando=""
          [ -n "$ACME_RESOLVER" ] || faltando="$faltando ACME_RESOLVER"
          [ -n "$DEPLOY_DIR" ] || faltando="$faltando DEPLOY_DIR"
          if [ -n "$faltando" ]; then
            echo "::error::Secrets ausentes:$faltando. Cadastre em Settings → Secrets and variables → Actions (ver .env.example)."
            exit 1
          fi

      # As imagens são públicas, então isto não é sobre acesso: é o limite de pull
      # anônimo do Docker Hub, que uma VPS com IP compartilhado estoura fácil.
      # Autenticado, a conferência abaixo não depende dessa cota.
      - name: Login no Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Falha aqui (e não na VPS) se a tag não existe — ex.: versão digitada
      # errada ou build que ainda não terminou.
      - name: Conferir se as imagens existem no registry
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -e
          for imagem in crm-api crm-web; do
            echo "Conferindo ${DOCKERHUB_NAMESPACE}/${imagem}:${TAG}..."
            if ! docker manifest inspect "${DOCKERHUB_NAMESPACE}/${imagem}:${TAG}" > /dev/null 2>&1; then
              echo "::error::Imagem ${imagem}:${TAG} não existe no Docker Hub. Rode o workflow de build antes."
              exit 1
            fi
          done

      - name: Criar diretório de deploy na VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: mkdir -p ${{ secrets.DEPLOY_DIR }}

      - name: Copiar docker-compose para a VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "docker-compose.prod.yml"
          target: ${{ secrets.DEPLOY_DIR }}

      - name: Deploy na VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          # Passa os segredos por env (nunca interpola direto no script).
          envs: IMAGE_TAG,CRM_DOMAIN,ACME_RESOLVER,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,APP_DB_PASSWORD,JWT_ACCESS_SECRET,JWT_REFRESH_SECRET,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,GITHUB_CLIENT_ID,GITHUB_CLIENT_SECRET,TURNSTILE_SECRET_KEY,REGISTRATION_ENABLED,SMTP_HOST,SMTP_PORT,SMTP_SECURE,SMTP_USER,SMTP_PASSWORD,MAIL_FROM,LEAD_INTAKE_TOKEN,LEAD_INTAKE_OWNER_EMAIL,BILLING_ENABLED,STRIPE_SECRET_KEY,STRIPE_WEBHOOK_SECRET,STRIPE_PRICE_ID
          script: |
            set -e
            cd ${{ secrets.DEPLOY_DIR }}

            # Gera o .env consumido pelo docker-compose.prod.yml
            umask 077
            cat > .env <<EOF
            IMAGE_TAG=${IMAGE_TAG}
            CRM_DOMAIN=${CRM_DOMAIN}
            ACME_RESOLVER=${ACME_RESOLVER}
            POSTGRES_USER=${POSTGRES_USER}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            POSTGRES_DB=${POSTGRES_DB}
            APP_DB_PASSWORD=${APP_DB_PASSWORD}
            JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
            JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
            GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
            GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
            GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
            GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
            TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY}
            SMTP_HOST=${SMTP_HOST}
            SMTP_PORT=${SMTP_PORT}
            SMTP_SECURE=${SMTP_SECURE}
            SMTP_USER=${SMTP_USER}
            SMTP_PASSWORD=${SMTP_PASSWORD}
            MAIL_FROM=${MAIL_FROM}
            LEAD_INTAKE_TOKEN=${LEAD_INTAKE_TOKEN}
            LEAD_INTAKE_OWNER_EMAIL=${LEAD_INTAKE_OWNER_EMAIL}
            REGISTRATION_ENABLED=${REGISTRATION_ENABLED}
            BILLING_ENABLED=${BILLING_ENABLED}
            STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
            STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
            STRIPE_PRICE_ID=${STRIPE_PRICE_ID}
            EOF

            # Um "$" dentro de um secret quebra o compose em silêncio: ele
            # interpola os valores lidos do .env, então `abc$FOO123` chega ao
            # container como `abc` — o resto virou "variável não definida" e foi
            # substituído por vazio. Em 27/07/2026 isso truncou SMTP_PASSWORD de
            # 32 para 13 caracteres e derrubou todo o envio de e-mail (incluindo
            # a redefinição de senha) sem um único erro no boot.
            # `$$` é o escape que o compose desfaz de volta para um "$" literal.
            sed -i 's/\$/$$/g' .env

            # Puxa as imagens da tag escolhida e reinicia os serviços
            docker compose -f docker-compose.prod.yml pull api web
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Limpa imagens antigas sem uso
            docker image prune -af

            docker compose -f docker-compose.prod.yml ps
        env:
          # O namespace das imagens não vai no .env da VPS: o compose já traz
          # `programeai` como default (as imagens são públicas).
          IMAGE_TAG: ${{ inputs.tag }}
          CRM_DOMAIN: ${{ secrets.CRM_DOMAIN }}
          ACME_RESOLVER: ${{ secrets.ACME_RESOLVER }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          # O GitHub reserva o prefixo GITHUB_ para nomes de secrets/vars, por isso
          # os secrets são GITHUBOAUTH_*; a env exportada para a VPS mantém o nome
          # GITHUB_CLIENT_* que a aplicação (oauth.service.ts) espera.
          GITHUB_CLIENT_ID: ${{ secrets.GITHUBOAUTH_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GITHUBOAUTH_CLIENT_SECRET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          # Ingestão externa de lead: os dois vazios deixam POST /leads/intake em
          # 503, que é o estado seguro de quem não usa a integração.
          LEAD_INTAKE_TOKEN: ${{ secrets.LEAD_INTAKE_TOKEN }}
          LEAD_INTAKE_OWNER_EMAIL: ${{ secrets.LEAD_INTAKE_OWNER_EMAIL }}
          REGISTRATION_ENABLED: ${{ secrets.REGISTRATION_ENABLED }}
          BILLING_ENABLED: ${{ secrets.BILLING_ENABLED }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_ID: ${{ secrets.STRIPE_PRICE_ID }}

      - name: Conferir o certificado TLS
        env:
          CRM_DOMAIN: ${{ secrets.CRM_DOMAIN }}
        run: |
          set -e
          sleep 20   # margem para o Traefik reconfigurar os routers
          issuer=$(echo | openssl s_client -connect "${CRM_DOMAIN}:443" \
            -servername "${CRM_DOMAIN}" 2>/dev/null \
            | openssl x509 -noout -issuer)
          echo "$issuer"
          case "$issuer" in
            *"Let's Encrypt"*) echo "TLS ok." ;;
            *) echo "::error::Certificado inesperado ($issuer). Confira ACME_RESOLVER."; exit 1 ;;
          esac

      # Certificado válido não prova que a aplicação atende. O deploy de
      # 27/07/2026 01:53 saiu verde com a API fora: o container morria no
      # entrypoint (migration falha), o Traefik ficava sem router para /api e o
      # nginx do front respondia o index.html com 200 — front no ar, CRM
      # inutilizável. Este passo é o que distingue as duas coisas.
      - name: Conferir se a API responde
        env:
          CRM_DOMAIN: ${{ secrets.CRM_DOMAIN }}
        run: |
          set -e
          # O healthcheck do container tem start_period de 60s; damos 2 minutos.
          for tentativa in $(seq 1 12); do
            corpo=$(curl -fsS --max-time 10 "https://${CRM_DOMAIN}/api/v1/health" || true)
            case "$corpo" in
              *'"status":"ok"'*)
                echo "API respondendo: $corpo"
                exit 0
                ;;
            esac
            echo "tentativa ${tentativa}/12 — resposta inesperada: $(printf '%.80s' "$corpo")"
            sleep 10
          done
          echo "::error::/api/v1/health não respondeu como a API em 2 minutos. \
          Provável container crm-api fora do ar — na VPS: \
          docker compose -f docker-compose.prod.yml logs api"
          exit 1

      - name: Resumo
        run: |
          {
            echo "### Deploy concluído"
            echo ""
            echo 'Tag publicada: `${{ inputs.tag }}`'
            echo ""
            echo 'https://crm.programeai.com.br'
          } >> "$GITHUB_STEP_SUMMARY"
