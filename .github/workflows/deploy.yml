name: Deploy na VPS

# Disparo manual (Actions → Deploy na VPS → Run workflow). As imagens já foram
# publicadas pelo workflow "Build - Imagens de produção"; aqui só escolhemos qual
# tag sobe. Deploy nunca acontece sozinho em push.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag das imagens a publicar: `latest` ou o SHA completo do commit (rollback)"
        required: true
        default: latest
        type: string

# Evita dois deploys simultâneos sobrescrevendo o mesmo diretório na VPS.
# Sem cancel-in-progress: um deploy em andamento não é interrompido no meio.
concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Quando a tag é um SHA, usa o compose DAQUELE commit — o arquivo de deploy
      # acompanha a imagem, senão um rollback subiria imagem antiga com compose
      # novo. Com `latest`, usa a ref de onde o workflow foi disparado.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag == 'latest' && github.ref || inputs.tag }}

      # Estes dois não têm default em lugar nenhum: ACME_RESOLVER errado quebraria
      # o TLS e DEPLOY_DIR vazio faria o compose rodar no home do usuário. Falhar
      # aqui é gratuito — um dispatch que para no runner não altera a produção.
      - name: Conferir configuração da VPS
        env:
          ACME_RESOLVER: ${{ secrets.ACME_RESOLVER }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          set -e
          faltando=""
          [ -n "$ACME_RESOLVER" ] || faltando="$faltando ACME_RESOLVER"
          [ -n "$DEPLOY_DIR" ] || faltando="$faltando DEPLOY_DIR"
          if [ -n "$faltando" ]; then
            echo "::error::Secrets ausentes:$faltando. Cadastre em Settings → Secrets and variables → Actions (ver .env.example)."
            exit 1
          fi

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Falha aqui (e não na VPS) se a tag não existe — ex.: SHA digitado errado
      # ou build que ainda não terminou.
      - name: Conferir se as imagens existem no registry
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TAG: ${{ inputs.tag }}
        run: |
          set -e
          for imagem in crm-api crm-web; do
            echo "Conferindo ${DOCKERHUB_USERNAME}/${imagem}:${TAG}..."
            if ! docker manifest inspect "${DOCKERHUB_USERNAME}/${imagem}:${TAG}" > /dev/null 2>&1; then
              echo "::error::Imagem ${imagem}:${TAG} não existe no Docker Hub. Rode o workflow de build antes."
              exit 1
            fi
          done

      - name: Criar diretório de deploy na VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: mkdir -p ${{ secrets.DEPLOY_DIR }}

      - name: Copiar docker-compose para a VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "docker-compose.prod.yml"
          target: ${{ secrets.DEPLOY_DIR }}

      - name: Deploy na VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          # Passa os segredos por env (nunca interpola direto no script).
          envs: IMAGE_TAG,DOCKERHUB_USERNAME,CRM_DOMAIN,ACME_RESOLVER,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,APP_DB_PASSWORD,JWT_ACCESS_SECRET,JWT_REFRESH_SECRET,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,GITHUB_CLIENT_ID,GITHUB_CLIENT_SECRET,TURNSTILE_SECRET_KEY,REGISTRATION_ENABLED,SMTP_HOST,SMTP_PORT,SMTP_SECURE,SMTP_USER,SMTP_PASSWORD,MAIL_FROM,BILLING_ENABLED,STRIPE_SECRET_KEY,STRIPE_WEBHOOK_SECRET,STRIPE_PRICE_ID
          script: |
            set -e
            cd ${{ secrets.DEPLOY_DIR }}

            # Gera o .env consumido pelo docker-compose.prod.yml
            umask 077
            cat > .env <<EOF
            IMAGE_TAG=${IMAGE_TAG}
            DOCKERHUB_USERNAME=${DOCKERHUB_USERNAME}
            CRM_DOMAIN=${CRM_DOMAIN}
            ACME_RESOLVER=${ACME_RESOLVER}
            POSTGRES_USER=${POSTGRES_USER}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            POSTGRES_DB=${POSTGRES_DB}
            APP_DB_PASSWORD=${APP_DB_PASSWORD}
            JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
            JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
            GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
            GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
            GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
            GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
            TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY}
            SMTP_HOST=${SMTP_HOST}
            SMTP_PORT=${SMTP_PORT}
            SMTP_SECURE=${SMTP_SECURE}
            SMTP_USER=${SMTP_USER}
            SMTP_PASSWORD=${SMTP_PASSWORD}
            MAIL_FROM=${MAIL_FROM}
            REGISTRATION_ENABLED=${REGISTRATION_ENABLED}
            BILLING_ENABLED=${BILLING_ENABLED}
            STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
            STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
            STRIPE_PRICE_ID=${STRIPE_PRICE_ID}
            EOF

            # Puxa as imagens da tag escolhida e reinicia os serviços
            docker compose -f docker-compose.prod.yml pull api web
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Limpa imagens antigas sem uso
            docker image prune -af

            docker compose -f docker-compose.prod.yml ps
        env:
          IMAGE_TAG: ${{ inputs.tag }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          CRM_DOMAIN: ${{ secrets.CRM_DOMAIN }}
          ACME_RESOLVER: ${{ secrets.ACME_RESOLVER }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          # O GitHub reserva o prefixo GITHUB_ para nomes de secrets/vars, por isso
          # os secrets são GITHUBOAUTH_*; a env exportada para a VPS mantém o nome
          # GITHUB_CLIENT_* que a aplicação (oauth.service.ts) espera.
          GITHUB_CLIENT_ID: ${{ secrets.GITHUBOAUTH_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GITHUBOAUTH_CLIENT_SECRET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          REGISTRATION_ENABLED: ${{ secrets.REGISTRATION_ENABLED }}
          BILLING_ENABLED: ${{ secrets.BILLING_ENABLED }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_ID: ${{ secrets.STRIPE_PRICE_ID }}

      - name: Conferir o certificado TLS
        env:
          CRM_DOMAIN: ${{ secrets.CRM_DOMAIN }}
        run: |
          set -e
          sleep 20   # margem para o Traefik reconfigurar os routers
          issuer=$(echo | openssl s_client -connect "${CRM_DOMAIN}:443" \
            -servername "${CRM_DOMAIN}" 2>/dev/null \
            | openssl x509 -noout -issuer)
          echo "$issuer"
          case "$issuer" in
            *"Let's Encrypt"*) echo "TLS ok." ;;
            *) echo "::error::Certificado inesperado ($issuer). Confira ACME_RESOLVER."; exit 1 ;;
          esac

      - name: Resumo
        run: |
          {
            echo "### Deploy concluído"
            echo ""
            echo 'Tag publicada: `${{ inputs.tag }}`'
            echo ""
            echo 'https://crm.programeai.com.br'
          } >> "$GITHUB_STEP_SUMMARY"
