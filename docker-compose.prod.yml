# Deploy de produção. Roteamento e TLS ficam a cargo de um reverse proxy já
# existente no host (Traefik neste exemplo), que precisa de uma rede externa
# chamada "traefik-proxy" e de um resolver ACME configurado — o nome do resolver
# vem de ACME_RESOLVER (ver .env.example).
#
# As imagens vêm do Docker Hub (publicadas pelo workflow de build) e as
# variáveis do arquivo .env que o workflow de deploy gera no diretório de deploy
# (ver .github/workflows/build.yml e .github/workflows/deploy.yml).
# IMAGE_TAG é escolhida no disparo do deploy: `latest` ou o SHA de um commit
# (rollback). O default local é `latest`.
# Este arquivo NÃO faz build: para desenvolvimento use `pnpm dev` +
# docker-compose.yml (só o Postgres local).
#
# Nome do projeto Compose: isola redes/volumes numa VPS compartilhada (em vez de
# depender do nome da pasta de deploy). É também o label `stack` no Grafana —
# `{stack="crm"}` é a consulta que traz este projeto inteiro (ver
# docs/observabilidade.md).
name: crm

# Rotação do log local de todo container deste projeto. O coletor da stack de
# observabilidade (Alloy) já empurra as linhas para o Loki; o arquivo no host é
# só a última milha — e sem limite o json-file cresce até encher o disco da VPS.
x-log-rotacionado: &log-rotacionado
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  # Front (bundle do Vite servido por nginx). Recebe tudo que não é /api.
  web:
    image: ${DOCKERHUB_USERNAME}/crm-web:${IMAGE_TAG:-latest}
    container_name: crm-web
    restart: unless-stopped
    depends_on:
      - api
    logging: *log-rotacionado
    networks:
      - traefik
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-proxy
      - traefik.http.routers.crm-web.rule=Host(`${CRM_DOMAIN}`)
      - traefik.http.routers.crm-web.entrypoints=websecure
      - traefik.http.routers.crm-web.tls=true
      - traefik.http.routers.crm-web.tls.certresolver=${ACME_RESOLVER}
      # Prioridade explícita nos DOIS routers: sem ela o Traefik usa o tamanho
      # da regra como prioridade, e um número fixo só na API poderia ficar
      # abaixo do default do front — que então engoliria /api.
      - traefik.http.routers.crm-web.priority=1
      - traefik.http.services.crm-web.loadbalancer.server.port=80

  # API (NestJS). Mesmo host do front, sob o prefixo /api — mesma origem, então
  # não há CORS nem cookie cross-site. O router usa prioridade 10 contra a 1 do
  # front, garantindo que /api chegue aqui e todo o resto no nginx.
  api:
    image: ${DOCKERHUB_USERNAME}/crm-api:${IMAGE_TAG:-latest}
    container_name: crm-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      # Único ponto de verdade das credenciais: as URLs são montadas a partir
      # das variáveis do Postgres, apontando para o serviço interno "postgres".
      # DATABASE_URL = crm_user (dono do schema; roda migrations, bypassa RLS).
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      # APP_DATABASE_URL = crm_app (NOSUPERUSER/NOBYPASSRLS; conexão da app).
      APP_DATABASE_URL: postgresql://crm_app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      # Lida pelo entrypoint para alinhar a senha da role crm_app no banco
      # (a migration a cria com senha de desenvolvimento).
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      # Front e API compartilham a origem: FRONTEND_URL (CORS + link de
      # redefinição de senha) e API_URL (redirect_uri do OAuth) são o mesmo host.
      FRONTEND_URL: https://${CRM_DOMAIN}
      API_URL: https://${CRM_DOMAIN}
      COOKIE_DOMAIN: ${CRM_DOMAIN}
      # 1 salto = só o Traefik. Ver .env.example para outras topologias.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
      # false fecha o autocadastro (register + criação de conta nova por OAuth).
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      # Ingestão externa de lead: as duas juntas ou a rota /leads/intake fica 503.
      LEAD_INTAKE_TOKEN: ${LEAD_INTAKE_TOKEN}
      LEAD_INTAKE_OWNER_EMAIL: ${LEAD_INTAKE_OWNER_EMAIL}
      BILLING_ENABLED: ${BILLING_ENABLED:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID}
    logging: *log-rotacionado
    networks:
      - traefik
      - interna
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      # Cobre migrations + ALTER ROLE do entrypoint antes do primeiro check.
      start_period: 60s
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-proxy
      - traefik.http.routers.crm-api.rule=Host(`${CRM_DOMAIN}`) && PathPrefix(`/api`)
      - traefik.http.routers.crm-api.entrypoints=websecure
      - traefik.http.routers.crm-api.tls=true
      - traefik.http.routers.crm-api.tls.certresolver=${ACME_RESOLVER}
      - traefik.http.routers.crm-api.priority=10
      - traefik.http.services.crm-api.loadbalancer.server.port=3000

  postgres:
    image: postgres:16-alpine
    container_name: crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - crm_pgdata:/var/lib/postgresql/data
    logging: *log-rotacionado
    networks:
      - interna
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  crm_pgdata:

networks:
  # Rede compartilhada com o reverse proxy (criada fora deste compose). O nome
  # externo esperado é "traefik-proxy"; o alias local "traefik" aponta pra ela.
  traefik:
    external: true
    name: traefik-proxy
  # Rede privada api <-> postgres (não exposta ao Traefik nem ao host).
  interna:
    driver: bridge
